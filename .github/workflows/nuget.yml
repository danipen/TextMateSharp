name: Publish NuGet package

on:
  push:
    tags:
      - v*
jobs:
  build:

    permissions:
      contents: read
      id-token: write  # required for nuget.org Trusted Publishing (OIDC)

    env:
      BUILD_CONFIG: 'Release'
      SOLUTION: 'TextMateSharp.sln'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Extract branch name
      shell: bash
      run: echo "branch=$(echo ${GITHUB_REF#refs/tags/v})" >> $GITHUB_OUTPUT
      id: extract_branch

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore $SOLUTION

    - name: Build
      run: dotnet build $SOLUTION --configuration $BUILD_CONFIG -p:Version=${{steps.extract_branch.outputs.branch}} --no-restore

    - name: Run tests
      run: dotnet test /p:Configuration=$BUILD_CONFIG --no-restore --no-build --verbosity normal

    - name: NuGet login (OIDC -> short-lived API key)
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: danipen

    - name: Publish
      run: dotnet nuget push **\*.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key ${{steps.nuget_login.outputs.NUGET_API_KEY}} --skip-duplicate
